<header><h1>OKIGAMI</h1><span class="badge" id="connection">接続を確認中</span></header>
<div class="tabs" role="tablist" aria-label="表示する内容"><button class="active" id="text-tab" type="button" role="tab" aria-selected="true" aria-controls="text-panel">文字</button><button id="image-tab" type="button" role="tab" aria-selected="false" aria-controls="image-panel">画像</button></div>
<section class="card preview-card" aria-label="表示プレビュー"><div class="orientation-row"><label for="orientation">表示の向き</label><select id="orientation"><option value="portrait">縦表示</option><option value="landscape">横表示</option></select></div><div id="image-fit-field" hidden><label for="image-fit">画像の収め方</label><select id="image-fit"><option value="contain">画像全体を表示</option><option value="cover">画面いっぱいに表示（周辺を切り抜く）</option></select></div><div class="preview-head"><h2>表示プレビュー</h2><span class="small" id="dimensions">縦 · 1072 × 1448</span></div><div class="preview-shell"><canvas id="preview" width="1072" height="1448" role="img" aria-label="Kindleに表示する内容のプレビュー"></canvas></div><p class="small" id="crop-help" hidden>画像を指で動かして、表示する位置を調整できます。</p><p class="small" id="fit-warning"></p><div id="crop-controls" hidden><label for="crop-x">左右の位置</label><div class="stepper"><button id="crop-x-minus" type="button" aria-label="画像の左側を多く表示" data-step-target="crop-x" data-step="-5">−</button><input id="crop-x" type="range" min="0" max="100" step="0.1" value="50"><button id="crop-x-plus" type="button" aria-label="画像の右側を多く表示" data-step-target="crop-x" data-step="5">＋</button></div><div class="range-ends"><span>左側を表示</span><span>右側を表示</span></div><label for="crop-y">上下の位置</label><div class="stepper"><button id="crop-y-minus" type="button" aria-label="画像の上側を多く表示" data-step-target="crop-y" data-step="-5">−</button><input id="crop-y" type="range" min="0" max="100" step="0.1" value="50"><button id="crop-y-plus" type="button" aria-label="画像の下側を多く表示" data-step-target="crop-y" data-step="5">＋</button></div><div class="range-ends"><span>上側を表示</span><span>下側を表示</span></div><button id="crop-reset" type="button">中央に戻す</button><p class="small" id="crop-note">画像を選ぶと、切り抜く位置を調整できます。</p></div></section>
<section class="card editor-card" aria-label="内容の編集"><div id="text-panel" role="tabpanel" aria-labelledby="text-tab"><label for="title">見出し（任意）</label><input id="title" type="text" maxlength="80" placeholder="今日のお知らせ"><label for="message">表示する文字</label><textarea id="message" maxlength="3000" placeholder="ここにメモや予定を入力">おかえりなさい。
今日も、よい一日を。</textarea><label for="text-font">フォント</label><select id="text-font"><option value="system">標準</option><option value="gothic">ゴシック（BIZ UD）</option><option value="mincho">明朝（BIZ UD）</option><option value="rounded">丸ゴシック（Zen Maru）</option></select><label class="check"><input type="checkbox" id="text-bold">太字にする</label><div><label for="font-size">文字サイズ <span id="font-label">64</span></label><div class="stepper"><button id="font-size-minus" type="button" aria-label="文字サイズを小さく" data-step-target="font-size" data-step="-1">−</button><input id="font-size" type="range" min="28" max="120" value="64" step="2"><button id="font-size-plus" type="button" aria-label="文字サイズを大きく" data-step-target="font-size" data-step="1">＋</button></div></div><label for="text-line-height">行間 <span id="text-line-height-label">1.65</span></label><div class="stepper"><button id="text-line-height-minus" type="button" aria-label="行間を狭く" data-step-target="text-line-height" data-step="-1">−</button><input id="text-line-height" type="range" min="100" max="240" step="5" value="165"><button id="text-line-height-plus" type="button" aria-label="行間を広く" data-step-target="text-line-height" data-step="1">＋</button></div><div><label for="align">配置</label><select id="align"><option value="left">左揃え</option><option value="center">中央揃え</option></select></div><label for="text-outline">文字の縁取りの太さ <span id="text-outline-label">0</span></label><div class="stepper"><button id="text-outline-minus" type="button" aria-label="文字の縁取りの太さを減らす" data-step-target="text-outline" data-step="-1">−</button><input id="text-outline" type="range" min="0" max="12" value="0" step="1"><button id="text-outline-plus" type="button" aria-label="文字の縁取りの太さを増やす" data-step-target="text-outline" data-step="1">＋</button></div><label class="check"><input type="checkbox" id="text-invert">白黒反転（黒背景・白文字）</label><label class="check"><input type="checkbox" id="vertical-center" checked>画面の中央に配置する</label></div>
<div id="image-panel" role="tabpanel" aria-labelledby="image-tab" hidden><label for="image-file">この端末から画像を選択</label><input id="image-file" type="file" accept="image/*"><label class="check"><input type="checkbox" id="dither">写真の階調を細かい点で表現する</label><label for="caption">画像に添える文字（任意）</label><textarea id="caption" maxlength="3000" rows="4" placeholder="ひとことメモ&#10;改行して入力できます"></textarea><label for="caption-font">添える文字のフォント</label><select id="caption-font"><option value="system">標準</option><option value="gothic">ゴシック（BIZ UD）</option><option value="mincho">明朝（BIZ UD）</option><option value="rounded">丸ゴシック（Zen Maru）</option></select><label class="check"><input type="checkbox" id="caption-bold">添える文字を太字にする</label><label for="caption-size">添える文字のサイズ <span id="caption-size-label">40</span></label><div class="stepper"><button id="caption-size-minus" type="button" aria-label="添える文字を小さく" data-step-target="caption-size" data-step="-1">−</button><input id="caption-size" type="range" min="28" max="120" value="40" step="2"><button id="caption-size-plus" type="button" aria-label="添える文字を大きく" data-step-target="caption-size" data-step="1">＋</button></div><label for="caption-line-height">添える文字の行間 <span id="caption-line-height-label">1.60</span></label><div class="stepper"><button id="caption-line-height-minus" type="button" aria-label="添える文字の行間を狭く" data-step-target="caption-line-height" data-step="-1">−</button><input id="caption-line-height" type="range" min="100" max="240" step="5" value="160"><button id="caption-line-height-plus" type="button" aria-label="添える文字の行間を広く" data-step-target="caption-line-height" data-step="1">＋</button></div><label for="caption-layout">文字の載せ方</label><select id="caption-layout"><option value="band">余白帯に置く</option><option value="overlay">写真に重ねる</option></select><label>添える文字の位置</label><input id="caption-anchor" type="hidden" value="8"><div class="anchor-grid" role="group" aria-label="添える文字の位置"><button type="button" data-caption-anchor="1" aria-label="1 左上" aria-pressed="false">1</button><button type="button" data-caption-anchor="2" aria-label="2 上中央" aria-pressed="false">2</button><button type="button" data-caption-anchor="3" aria-label="3 右上" aria-pressed="false">3</button><button type="button" data-caption-anchor="4" aria-label="4 左中央" aria-pressed="false">4</button><button type="button" data-caption-anchor="5" aria-label="5 中央" aria-pressed="false">5</button><button type="button" data-caption-anchor="6" aria-label="6 右中央" aria-pressed="false">6</button><button type="button" data-caption-anchor="7" aria-label="7 左下" aria-pressed="false">7</button><button type="button" data-caption-anchor="8" aria-label="8 下中央" aria-pressed="true">8</button><button type="button" data-caption-anchor="9" aria-label="9 右下" aria-pressed="false">9</button></div><label for="caption-outline">添える文字の縁取りの太さ <span id="caption-outline-label">0</span></label><div class="stepper"><button id="caption-outline-minus" type="button" aria-label="添える文字の縁取りの太さを減らす" data-step-target="caption-outline" data-step="-1">−</button><input id="caption-outline" type="range" min="0" max="12" value="0" step="1"><button id="caption-outline-plus" type="button" aria-label="添える文字の縁取りの太さを増やす" data-step-target="caption-outline" data-step="1">＋</button></div><p class="small">黒文字には白、白文字には黒の縁取りを付けます。0で縁取りなし。</p><label class="check"><input type="checkbox" id="caption-invert"><span id="caption-invert-label">白黒反転（黒背景・白文字）</span></label><div id="caption-padding-field"><label for="caption-padding">余白帯の上下幅 <span id="caption-padding-label">35</span></label><div class="stepper"><button id="caption-padding-minus" type="button" aria-label="余白帯の上下幅を減らす" data-step-target="caption-padding" data-step="-1">−</button><input id="caption-padding" type="range" min="0" max="160" value="35" step="1"><button id="caption-padding-plus" type="button" aria-label="余白帯の上下幅を増やす" data-step-target="caption-padding" data-step="1">＋</button></div></div></div></section>
<section class="card settings-card" aria-label="自動スリープ設定"><label for="sleep-after">自動スリープ</label><select id="sleep-after"><option value="0">Kindle標準</option><option value="5">5秒</option><option value="30">30秒</option><option value="60">1分</option><option value="180">3分</option><option value="300">5分</option></select><p class="small">最後の操作からの待ち時間です。編集中は延長されます。</p></section>
</main><footer class="send-bar" id="send-bar"><div class="send-inner"><div id="status" role="status" aria-live="polite"></div><button class="primary" id="send" disabled>Kindleに表示する</button></div></footer><script>
'use strict';

for(const id of ['text-font','caption-font','text-bold','caption-bold'])$(id).onchange=()=>{render();ensureSelectedFont()};
$('title').addEventListener('input',()=>{if(!selectedFontReady())ensureSelectedFont()});
function wrapped(text,maxWidth){const lines=[];for(const paragraph of text.split('\n')){let line='';for(const ch of paragraph){if(line&&ctx.measureText(line+ch).width>maxWidth){lines.push(line);line=ch}else{line+=ch}}lines.push(line)}return lines}

const clampUnit=value=>Math.max(0,Math.min(1,value));

 const moveX=!!can&&imagePlacement.overflowX>.5,moveY=!!can&&imagePlacement.overflowY>.5;

function quantize(context,dither){const pixels=context.getImageData(0,0,W,H),p=pixels.data,matrix=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;let v=.2126*p[i]+.7152*p[i+1]+.0722*p[i+2];if(dither)v+=(matrix[(y%4)*4+x%4]-7.5)*1.9;v=Math.max(0,Math.min(255,Math.round(v/17)*17));p[i]=p[i+1]=p[i+2]=v;p[i+3]=255}context.putImageData(pixels,0,0)}
function captionAnchor(value,w,h,textH,overlay,padding,bandH){
 const index=Math.max(1,Math.min(9,Math.round(value)||8))-1,row=Math.floor(index/3),col=index%3,bandY=row===0?0:(row===1?Math.max(0,(h-bandH)/2):Math.max(0,h-bandH));

const anchorButtons=document.querySelectorAll('[data-caption-anchor]');

function render(){

 if(mode==='text'){
  const size=+$('font-size').value,outline=+$('text-outline').value,ink=inverted?'#fff':'#000';$('font-label').textContent=size;
  ctx.font=contentFont(size);const lines=wrapped($('message').value.replace(/\r/g,''),contentW),lineH=size*+$('text-line-height').value/100;
  ctx.font=contentFont(48,true);const titles=$('title').value?wrapped($('title').value,contentW):[],titleLineH=48*+$('text-line-height').value/100,titleH=titles.length?titles.length*titleLineH+64:0;
  const total=titleH+lines.length*lineH;overflow=total>contentH-margin*2;let y=$('vertical-center').checked?Math.max(margin,(contentH-total)/2):margin;

  ctx.font=contentFont(size,false,'caption');const capLines=cap?wrapped(cap.replace(/\r/g,''),contentW):[],textH=capLines.length*lineH,capH=capLines.length&&!overlay?textH+padding*2:0;

}
function tab(next){mode=next;$('image-fit-field').hidden=next!=='image';$('text-panel').hidden=next!=='text';$('image-panel').hidden=next!=='image';$('text-tab').classList.toggle('active',next==='text');$('image-tab').classList.toggle('active',next==='image');$('text-tab').setAttribute('aria-selected',String(next==='text'));$('image-tab').setAttribute('aria-selected',String(next==='image'));render();ensureSelectedFont()}

for(const id of ['title','message','font-size','align','vertical-center','image-fit','caption','caption-size','caption-layout','caption-padding','caption-outline','caption-invert','text-outline','text-invert','text-line-height','caption-line-height','dither'])$(id).addEventListener('input',render);
$('image-file').onchange=async()=>{const f=$('image-file').files[0];if(!f)return;if(f.size>30*1024*1024){status('30MB以下の画像を選択してください。',true);return}const url=URL.createObjectURL(f),img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});loadedImage=img;cropX=cropY=.5;status('画像を読み込みました。');render()}catch{status('この画像を読み込めませんでした。JPEGやPNGを試してください。',true)}finally{URL.revokeObjectURL(url)}};
async function api(path,options={}){const {timeoutMs=45000,...request}=options;const response=await fetch(path,{...request,headers:{...request.headers,'X-Board-Token':token},cache:'no-store',signal:AbortSignal.timeout(timeoutMs)});if(!response.ok){const error=new Error(await response.text());error.status=response.status;throw error}return response}

$('send').onclick=async()=>{if(!ready||busy||fontsBusy||!selectedFontReady()||overflow)return;flushCropRender();busy=true;controls();status('Kindleへ送信しています…');try{const blob=await new Promise(resolve=>rawCanvas.toBlob(resolve,'image/png'));if(!blob)throw new Error('画像を作成できませんでした。');await api('/api/frame',{method:'POST',body:blob,headers:{'Content-Type':'image/png'}});status(previewMode?'PCプレビューに保存しました。実機には送信していません。':'Kindleに表示しました。')}catch(e){status('送信できませんでした。Kindleが受信モードか確認してください。 '+e.message,true)}finally{busy=false;controls()}};
let activityTimer=null,lastActivityPost=0;

for(const event of ['input','change','pointerdown','keydown'])document.addEventListener(event,noteBrowserActivity,{passive:true});
$('sleep-after').onchange=async()=>{if(!ready)return;busy=true;controls();try{await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sleepAfterSeconds:+$('sleep-after').value})});status($('sleep-after').value==='0'?'Kindle標準のスリープ時間にしました。':'操作を止めてから'+$('sleep-after').selectedOptions[0].textContent+'でスリープします。')}catch(e){status(e.message,true)}finally{busy=false;controls()}};
let checkingConnection=false,invalidConnectionToken=false,connectionInitialized=false;

async function syncConnection(initial=false){
 if(checkingConnection||invalidConnectionToken||busy||document.hidden||!token)return;

 try{
  const c=await(await api('/api/config',{timeoutMs:3000})).json(),wasReady=ready;

  ready=!c.sleeping;$('sleep-after').value=String(c.sleepAfterSeconds||0);
